name: C++ Build Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSYS2 (GCC/g++)
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: mingw-w64-x86_64-gcc

    - name: Compile Standalone Executable
      shell: msys2 {0}
      run: |
        g++ -static -static-libgcc -static-libstdc++ main.cpp -o program.exe -lcrypt32

    - name: Verify Build Output
      run: |
        if (Test-Path .\program.exe) { echo "Success: EXE generated properly!" } else { exit 1 }
